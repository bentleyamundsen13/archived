# Netlify configuration
# Set your secret in the Netlify UI (Site settings -> Environment variables):
#   GROQ_API_KEY = your key
# Never put the key in this file or anywhere in src/.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# The frontend calls host-neutral /api/* paths so the same code runs on
# Netlify and Vercel. On Netlify, map those to the functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
